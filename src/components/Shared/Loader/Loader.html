<style>
  @import url('https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,200;0,400;0,700;0,900;1,900&display=swap');

  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  body {
    font-family: 'Montserrat', sans-serif;
  }

  .showcase {
    display: flex;
    flex-direction: column;
    gap: 0;
  }

  /* ── section label ── */
  .sec-label {
    padding: .6rem 1.4rem;
    font-size: 9px;
    letter-spacing: .18em;
    text-transform: uppercase;
    color: #5a9abc;
    font-weight: 700;
    background: #f0f8ff;
    border-bottom: 0.5px solid #a5dcfa33;
  }

  /* ── stage ── */
  .stage {
    position: relative;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    border-bottom: 0.5px solid #a5dcfa22;
  }

  .stage:hover .rh {
    opacity: 1;
  }

  .rh {
    position: absolute;
    bottom: 10px;
    right: 14px;
    font-size: 9px;
    letter-spacing: .1em;
    color: #5a9abc88;
    opacity: 0;
    transition: opacity .3s;
    pointer-events: none;
    text-transform: uppercase;
  }

  /* ══════════════════════════════════════
   VARIANT A — LIGHT FULL SEQUENCE
   bg: #f0f8ff  tall stage for all phases
══════════════════════════════════════ */
  .va {
    background: #f0f8ff;
    min-height: 420px;
    flex-direction: column;
    gap: 0;
  }

  /* ── PHASE 1: intro ── */
  .ph-intro {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 12px;
    padding: 2.4rem 2rem 1.6rem;
    width: 100%;
  }

  /* floating ambient shapes */
  .ambient {
    position: absolute;
    inset: 0;
    pointer-events: none;
    overflow: hidden;
  }

  .sh-circle {
    position: absolute;
    border-radius: 50%;
    border: 1px solid #a5dcfa44;
    animation: shCircle 6s ease-in-out infinite;
  }

  .sh-circle.c1 {
    width: 260px;
    height: 260px;
    top: -80px;
    left: -60px;
    animation-delay: 0s;
    border-color: #a5dcfa33;
  }

  .sh-circle.c2 {
    width: 180px;
    height: 180px;
    top: 30px;
    right: -40px;
    animation-delay: 1.5s;
    border-color: #00b7a833;
  }

  .sh-circle.c3 {
    width: 90px;
    height: 90px;
    bottom: 20px;
    left: 30px;
    animation-delay: 3s;
    border-color: #a5dcfa55;
  }

  .sh-cross {
    position: absolute;
    animation: shCross 5s ease-in-out infinite;
  }

  .sh-cross::before,
  .sh-cross::after {
    content: '';
    position: absolute;
    background: #a5dcfa44;
    border-radius: 2px;
  }

  .sh-cross::before {
    width: 2px;
    height: 24px;
    left: 50%;
    transform: translateX(-50%);
  }

  .sh-cross::after {
    width: 24px;
    height: 2px;
    top: 50%;
    transform: translateY(-50%);
  }

  .sh-cross.x1 {
    width: 24px;
    height: 24px;
    bottom: 60px;
    right: 60px;
    animation-delay: .8s;
  }

  .sh-cross.x2 {
    width: 18px;
    height: 18px;
    top: 50px;
    left: 100px;
    animation-delay: 2.2s;
  }

  .sh-diamond {
    position: absolute;
    width: 14px;
    height: 14px;
    border: 1.5px solid #00b7a844;
    transform: rotate(45deg);
    animation: shDiamond 4s ease-in-out infinite;
  }

  .sh-diamond.d1 {
    bottom: 80px;
    right: 100px;
    animation-delay: 1s;
  }

  .sh-diamond.d2 {
    top: 40px;
    left: 50px;
    width: 9px;
    height: 9px;
    animation-delay: 2.5s;
  }

  .sh-dot {
    position: absolute;
    border-radius: 50%;
    background: #a5dcfa66;
    animation: shDot 3.5s ease-in-out infinite;
  }

  .sh-dot.dt1 {
    width: 5px;
    height: 5px;
    top: 80px;
    right: 80px;
    animation-delay: .3s;
  }

  .sh-dot.dt2 {
    width: 3px;
    height: 3px;
    bottom: 90px;
    left: 80px;
    animation-delay: 1.8s;
  }

  .sh-dot.dt3 {
    width: 4px;
    height: 4px;
    top: 130px;
    left: 160px;
    animation-delay: 3.2s;
    background: #00b7a866;
  }

  .sh-line {
    position: absolute;
    background: #a5dcfa33;
    animation: shLine 7s ease-in-out infinite;
  }

  .sh-line.l1 {
    width: 60px;
    height: 1px;
    top: 100px;
    left: -10px;
    animation-delay: 0s;
    transform: rotate(-20deg);
  }

  .sh-line.l2 {
    width: 40px;
    height: 1px;
    bottom: 100px;
    right: 20px;
    animation-delay: 2s;
    transform: rotate(15deg);
  }

  .sh-arc {
    position: absolute;
  }

  .sh-arc.a1 {
    top: 160px;
    right: 20px;
    opacity: 0;
    animation: shArc 5s ease-in-out infinite;
    animation-delay: .5s;
  }

  .sh-arc.a2 {
    bottom: 40px;
    left: 20px;
    opacity: 0;
    animation: shArc 5s ease-in-out infinite;
    animation-delay: 2.5s;
  }

  @keyframes shCircle {

    0%,
    100% {
      transform: scale(1);
      opacity: .7;
    }

    50% {
      transform: scale(1.06);
      opacity: 1;
    }
  }

  @keyframes shCross {

    0%,
    100% {
      opacity: .5;
      transform: rotate(0deg);
    }

    50% {
      opacity: 1;
      transform: rotate(10deg);
    }
  }

  @keyframes shDiamond {

    0%,
    100% {
      opacity: .4;
      transform: rotate(45deg) scale(1);
    }

    50% {
      opacity: .9;
      transform: rotate(45deg) scale(1.2);
    }
  }

  @keyframes shDot {

    0%,
    100% {
      opacity: .4;
      transform: scale(1);
    }

    50% {
      opacity: 1;
      transform: scale(1.5);
    }
  }

  @keyframes shLine {

    0%,
    100% {
      opacity: .3;
      transform: scaleX(1) rotate(-20deg);
    }

    50% {
      opacity: .7;
      transform: scaleX(1.3) rotate(-20deg);
    }
  }

  @keyframes shArc {

    0%,
    100% {
      opacity: 0;
    }

    30%,
    70% {
      opacity: 1;
    }
  }

  /* ── word mark ── */
  .wordmark {
    display: flex;
    align-items: center;
    position: relative;
  }

  .wl {
    display: inline-block;
    font-size: 68px;
    font-weight: 900;
    opacity: 0;
    filter: blur(18px);
    transform: scale(1.7);
    animation: vapIn 2s cubic-bezier(.16, 1, .3, 1) forwards;
  }

  .wl.w1 {
    animation-delay: .0s;
    color: #023e8a;
  }

  .wl.w2 {
    animation-delay: .08s;
    color: #0b52a8;
  }

  .wl.w3 {
    animation-delay: .16s;
    color: #1462b2;
  }

  .wl.w4 {
    animation-delay: .24s;
    color: #0a7a70;
  }

  /* Q morph → tooth  */
  .q-wrap {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 52px;
    height: 76px;
    position: relative;
    margin-left: 1px;
  }

  .q-letter {
    position: absolute;
    font-size: 68px;
    font-weight: 900;
    color: #00b7a8;
    font-style: italic;
    opacity: 0;
    filter: blur(16px);
    transform: scale(1.6);
    animation: vapIn 2s cubic-bezier(.16, 1, .3, 1) forwards .3s;
  }

  .tooth-svg {
    position: absolute;
    opacity: 0;
    transform: translateY(40px) scale(.5);
    filter: blur(10px);
    animation: toothMorph 1.1s cubic-bezier(.34, 1.5, .64, 1) forwards 2.8s;
  }

  .q-exit {
    animation: qFade .5s ease forwards 2.6s;
  }

  @keyframes vapIn {
    0% {
      opacity: 0;
      filter: blur(18px);
      transform: scale(1.7);
    }

    40% {
      opacity: 1;
      filter: blur(3px);
      transform: scale(1.04);
    }

    100% {
      opacity: 1;
      filter: blur(0);
      transform: scale(1);
    }
  }

  @keyframes qFade {
    to {
      opacity: 0;
      filter: blur(8px);
      transform: scale(.8);
    }
  }

  @keyframes toothMorph {
    0% {
      opacity: 0;
      transform: translateY(40px) scale(.5);
      filter: blur(10px);
    }

    55% {
      opacity: 1;
      filter: blur(1px);
      transform: translateY(-5px) scale(1.1);
    }

    75% {
      transform: translateY(2px) scale(.97);
    }

    100% {
      opacity: 1;
      filter: blur(0);
      transform: translateY(0) scale(1);
    }
  }

  /* tagline */
  .tagline {
    font-size: 10px;
    letter-spacing: .22em;
    color: #5a9abc;
    text-transform: uppercase;
    opacity: 0;
    animation: tagUp .7s ease forwards 3.6s;
  }

  @keyframes tagUp {
    from {
      opacity: 0;
      transform: translateY(8px);
    }

    to {
      opacity: 1;
      transform: translateY(0);
    }
  }

  /* rule line */
  .rule {
    width: 0;
    height: 1px;
    background: #a5dcfa66;
    animation: ruleGrow .5s ease forwards 3.4s;
  }

  @keyframes ruleGrow {
    to {
      width: 160px;
    }
  }

  /* ── PHASE 2: loading bar ── */
  .ph-load {
    width: 100%;
    padding: 1.4rem 2rem;
    border-top: 0.5px solid #a5dcfa22;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
    opacity: 0;
    animation: fadeUp .5s ease forwards 3.9s;
  }

  .load-label {
    font-size: 9px;
    letter-spacing: .15em;
    color: #7ab0cc;
    text-transform: uppercase;
  }

  .load-track {
    width: 220px;
    height: 2px;
    background: #a5dcfa22;
    border-radius: 1px;
    overflow: hidden;
  }

  .load-fill {
    height: 100%;
    background: #00b7a8;
    border-radius: 1px;
    width: 0%;
    animation: loadFill 2.4s cubic-bezier(.4, 0, .2, 1) forwards 4.2s;
  }

  @keyframes loadFill {
    0% {
      width: 0%;
    }

    60% {
      width: 72%;
    }

    80% {
      width: 85%;
    }

    100% {
      width: 100%;
    }
  }

  /* spinning shapes during load */
  .load-shapes {
    display: flex;
    align-items: center;
    gap: 14px;
  }

  .ls-orbit {
    width: 28px;
    height: 28px;
    border-radius: 50%;
    border: 1.5px solid #a5dcfa44;
    position: relative;
    animation: lsOrbit 2s linear infinite;
    animation-play-state: paused;
  }

  .ls-orbit.active {
    animation-play-state: running;
  }

  .ls-orbit::after {
    content: '';
    position: absolute;
    width: 5px;
    height: 5px;
    background: #00b7a8;
    border-radius: 50%;
    top: -3px;
    left: 50%;
    transform: translateX(-50%);
  }

  .ls-cross {
    width: 20px;
    height: 20px;
    position: relative;
    animation: lsCross 1.8s ease-in-out infinite;
    animation-play-state: paused;
  }

  .ls-cross.active {
    animation-play-state: running;
  }

  .ls-cross::before,
  .ls-cross::after {
    content: '';
    position: absolute;
    background: #a5dcfa77;
    border-radius: 1px;
  }

  .ls-cross::before {
    width: 1.5px;
    height: 20px;
    left: 50%;
    transform: translateX(-50%);
  }

  .ls-cross::after {
    width: 20px;
    height: 1.5px;
    top: 50%;
    transform: translateY(-50%);
  }

  .ls-diamond {
    width: 12px;
    height: 12px;
    border: 1.5px solid #00b7a877;
    transform: rotate(45deg);
    animation: lsDiamond 2.2s ease-in-out infinite;
    animation-play-state: paused;
  }

  .ls-diamond.active {
    animation-play-state: running;
  }

  .ls-tooth-wrap {
    animation: lsToothPulse 1.6s ease-in-out infinite;
    animation-play-state: paused;
  }

  .ls-tooth-wrap.active {
    animation-play-state: running;
  }

  .ls-dots {
    display: flex;
    gap: 5px;
    align-items: center;
  }

  .ls-d {
    width: 5px;
    height: 5px;
    border-radius: 50%;
    background: #a5dcfa;
    animation: lsDot 1.2s ease-in-out infinite;
    animation-play-state: paused;
  }

  .ls-d.active {
    animation-play-state: running;
  }

  .ls-d:nth-child(2) {
    animation-delay: .2s;
  }

  .ls-d:nth-child(3) {
    animation-delay: .4s;
    background: #00b7a8;
  }

  @keyframes lsOrbit {
    to {
      transform: rotate(360deg);
    }
  }

  @keyframes lsCross {

    0%,
    100% {
      transform: rotate(0deg);
      opacity: .6;
    }

    50% {
      transform: rotate(180deg);
      opacity: 1;
    }
  }

  @keyframes lsDiamond {

    0%,
    100% {
      transform: rotate(45deg) scale(1);
      opacity: .5;
    }

    50% {
      transform: rotate(135deg) scale(1.3);
      opacity: 1;
    }
  }

  @keyframes lsToothPulse {

    0%,
    100% {
      transform: scale(.9);
      opacity: .6;
    }

    50% {
      transform: scale(1.1);
      opacity: 1;
    }
  }

  @keyframes lsDot {

    0%,
    100% {
      transform: translateY(0);
      opacity: .4;
    }

    50% {
      transform: translateY(-5px);
      opacity: 1;
    }
  }

  /* ── PHASE 3: outro exit ── */
  .ph-outro {
    width: 100%;
    padding: 0 2rem 2rem;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
    opacity: 0;
    animation: fadeUp .4s ease forwards 6.8s;
  }

  .outro-brand {
    display: flex;
    align-items: center;
    gap: 4px;
  }

  .ob-letter {
    display: inline-block;
    font-size: 48px;
    font-weight: 900;
    color: #023e8a;
    animation: outroExit 1s cubic-bezier(.4, 0, 1, .6) forwards 7.4s;
  }

  .ob-letter:nth-child(1) {
    animation-delay: 7.4s;
  }

  .ob-letter:nth-child(2) {
    animation-delay: 7.44s;
  }

  .ob-letter:nth-child(3) {
    animation-delay: 7.48s;
  }

  .ob-letter:nth-child(4) {
    animation-delay: 7.52s;
    color: #0a7a70;
  }

  .ob-tooth {
    animation: toothOutro 1s cubic-bezier(.4, 0, 1, .6) forwards 7.56s;
  }

  @keyframes outroExit {
    0% {
      opacity: 1;
      transform: translateX(0) scaleX(1);
    }

    30% {
      transform: translateX(-4px) scaleX(.95);
    }

    100% {
      opacity: 0;
      transform: translateX(-120px) scaleX(.3);
    }
  }

  @keyframes toothOutro {
    0% {
      opacity: 1;
      transform: translateX(0) scale(1);
    }

    100% {
      opacity: 0;
      transform: translateX(200px) scale(.4);
    }
  }

  .outro-trail {
    position: absolute;
    right: 0;
    top: 50%;
    height: 1.5px;
    background: #00b7a8;
    width: 0;
    animation: trailShoot .6s ease forwards 7.56s;
    pointer-events: none;
  }

  @keyframes trailShoot {
    from {
      width: 0;
      opacity: .8;
    }

    to {
      width: 60%;
      opacity: 0;
    }
  }

  .outro-sub {
    font-size: 9px;
    letter-spacing: .2em;
    color: #7ab0cc88;
    text-transform: uppercase;
    opacity: 0;
    animation: fadeUp .5s ease forwards 7.1s;
  }

  /* ═══════════════════════════════════
   VARIANT B — DARK VERSION
═══════════════════════════════════ */
  .vb {
    background: #010f1c;
    min-height: 420px;
    flex-direction: column;
  }

  .vb .sh-circle {
    border-color: #a5dcfa1a;
  }

  .vb .sh-circle.c1 {
    border-color: #a5dcfa22;
  }

  .vb .sh-circle.c2 {
    border-color: #00b7a822;
  }

  .vb .sh-cross::before,
  .vb .sh-cross::after {
    background: #a5dcfa33;
  }

  .vb .sh-diamond {
    border-color: #00b7a833;
  }

  .vb .sh-dot {
    background: #a5dcfa44;
  }

  .vb .sh-dot.dt3 {
    background: #00b7a844;
  }

  .vb .sh-line {
    background: #a5dcfa22;
  }

  .vb .wl.w1 {
    color: #b8ddf8;
  }

  .vb .wl.w2 {
    color: #a0d4f6;
  }

  .vb .wl.w3 {
    color: #8acaee;
  }

  .vb .wl.w4 {
    color: #4ec8bc;
  }

  .vb .q-letter {
    color: #00d4c2;
  }

  .vb .rule {
    background: #a5dcfa33;
  }

  .vb .tagline {
    color: #5a9abc;
  }

  .vb .load-track {
    background: #a5dcfa11;
  }

  .vb .load-label {
    color: #4a8096;
  }

  .vb .ph-load {
    border-top-color: #a5dcfa11;
  }

  .vb .ls-cross::before,
  .vb .ls-cross::after {
    background: #a5dcfa44;
  }

  .vb .ls-orbit {
    border-color: #a5dcfa33;
  }

  .vb .ls-d {
    background: #7ab8d4;
  }

  .vb .ls-d:nth-child(3) {
    background: #00b7a8;
  }

  .vb .ls-diamond {
    border-color: #00b7a855;
  }

  .vb .ob-letter {
    color: #a5dcfa;
  }

  .vb .ob-letter:nth-child(4) {
    color: #4ec8bc;
  }

  .vb .outro-sub {
    color: #4a809688;
  }

  .vb .sec-label-inner {
    color: #4a8096;
  }

  @keyframes fadeUp {
    from {
      opacity: 0;
      transform: translateY(8px);
    }

    to {
      opacity: 1;
      transform: translateY(0);
    }
  }
</style>
